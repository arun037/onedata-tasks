services:
  mydb:
    image: mysql:8.0
    container_name: mydb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "root@1234"
      MYSQL_DATABASE: "mydb"
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 4s
      retries: 5

  api:
    build: .
    container_name: fastapi-app
    restart: always
    depends_on:
      mydb:
        condition: service_healthy
    environment:
      DB_HOST: "mydb"
      DB_USER: "root"
      DB_PASS: "root@1234"
      DB_NAME: "mydb"
      DB_POOL_SIZE: "2"
    ports:
      - "8000:8000"
